<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Italian Knowledge Web</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #F2EBE0; font-family: 'Segoe UI', system-ui, sans-serif; color: #2C1F14;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .card {
    text-align: center;
  }
  h1 { font-size: 22px; letter-spacing: 1px; margin-bottom: 28px; }
  .links { display: flex; gap: 16px; justify-content: center; }
  a.student-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 28px; border-radius: 20px; font-size: 15px; font-weight: 600;
    border: 1.5px solid rgba(44,31,20,0.15); background: rgba(255,255,255,0.7);
    color: #2C1F14; text-decoration: none; transition: all 0.2s;
  }
  a.student-link:hover { background: rgba(255,255,255,0.95); border-color: rgba(58,126,140,0.5); }
</style>
</head>
<body>
<div class="card">
  <h1>🇮🇹 Italian Knowledge Web</h1>
  <div class="links">
    <a class="student-link" href="./nick/">📚 Nick</a>
    <a class="student-link" href="./alina/">📚 Alina</a>
  </div>
</div>
</body>
</html>
