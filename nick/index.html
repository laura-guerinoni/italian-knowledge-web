<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<title>Italian Knowledge Web — Lezioni per Nick!</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="notranslate">
<canvas id="canvas"></canvas>
<div id="header">
  <h1>🇮🇹 Italian Knowledge Web</h1>
</div>
<div id="search-bar">
  <input type="text" id="search-input" placeholder="Search topics…" oninput="filterNodes(this.value)">
</div>
<div id="legend"></div>
<div id="hint"></div>
<div id="panel">
  <div id="panel-header">
    <div id="panel-icon">📚</div>
    <div id="panel-title">Topic</div>
    <div id="panel-subtitle">Subtitle</div>
    <button id="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div id="panel-body"></div>
</div>
<div id="flashcard-overlay">
  <button id="fc-close-btn" onclick="closeDrill()">✕</button>
  <div id="fc-topic">Topic</div>
  <div id="fc-card" onclick="revealCard()">
    <div id="fc-icon">📚</div>
    <div id="fc-type-label"></div>
    <div id="fc-front"></div>
    <div id="fc-back" style="display:none"></div>
    <div id="fc-tap-hint">tap to reveal</div>
  </div>
  <div id="fc-controls">
    <button class="fc-btn" onclick="prevCard()">← Prev</button>
    <div id="fc-progress">1 / 1</div>
    <button class="fc-btn primary" onclick="nextCard()">Next →</button>
  </div>
</div>
<script src="../engine.js"></script>
<script>boot('nick');</script>
<script data-goatcounter="https://laurikitita.goatcounter.com/count"
        data-goatcounter-settings='{"path": "nick"}'
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
